name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pegrna-designer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check scripts parse
        run: node --check pegrna-designer/pegrna.js && node --check pegrna-designer/app.js
      - name: Run test suite
        run: node pegrna-designer/test.js
